name: 6.6.118 欧加真OKI内核快速构建

env:
  TZ: Asia/Shanghai
  ANDROID_VERSION: 'android15'
  KERNEL_VERSION: '6.6'
  SUB_VERSION: '118'
  KERNEL_NAME: 'android15-8-g29d86c5fc9dd-abogki428889875-4k'
  CCACHE_KEY: ccache-ecsv4-6.6.118

on:
  workflow_dispatch:
    inputs:
      ksu_type:
        description: 'KernelSU分支(ReSukiSU/SukiSU Ultra/KernelSU Next/KSU(原版)/无内置KSU,默认ReSukiSU)'
        required: true
        type: choice
        default: 'resukisu'
        options:
          - 'resukisu'
          - 'sukisu'
          - 'ksunext'
          - 'ksu'
          - 'none'
      susfs_enable:
        description: '是否开启SUSFS（SukiSU Ultra 使用官方 builtin 分支并启用 ARM64 branch-link hook；其他分支沿用各自补丁流程）'
        required: true
        type: boolean
        default: 'true'
      kpm_enable:
        description: '是否开启 KPM（SukiSU Ultra 按官方集成方式启用 CONFIG_KPM；ReSukiSU 沿用现有流程）'
        required: true
        type: boolean
        default: 'false'
      lz4_enable:
        description: '是否安装 lz4 1.10.0+zstd 1.5.7 补丁'
        required: true
        type: boolean
        default: 'true'
      lz4kd_enable:
        description: '是否安装 LZ4KD 补丁(若已开启lz4+zstd补丁则可不开启)'
        required: true
        type: boolean
        default: 'false'
      bbr_enable:
        description: "是否启用bbr算法(优化上行数据,对手机日用无太大意义甚至可能负优化;false关闭,true仅加入算法,default启用算法并设为默认)"
        required: true
        type: choice
        default: 'false'
        options:
          - 'false'
          - 'true'
          - 'default'
      droidspaces_enable:
        description: '是否启用Droidspaces容器支持(轻量化的完整Linux容器支持;false关闭,standard开启容器+ntsync支持,extend开启更多测试支持项)'
        required: true
        type: choice
        default: 'false'
        options:
          - 'false'
          - 'standard'
          - 'extend'
      better_net:
        description: '是否开启网络功能拓展配置(用于为ipset及需要iptables等高级网络功能内核支持的程序提供支持)'
        required: true
        type: boolean
        default: 'false'
      adios_enable:
        description: '是否启用ADIOS IO调度器支持(提升IO读写性能)'
        required: true
        type: boolean
        default: 'true'
      rekernel_enable:
        description: '是否启用Re-Kernel支持(与Freezer/NoActive等软件配合, 提升应用冻结能力)'
        required: true
        type: boolean
        default: 'false'
      baseband_guard:
        description: '是否开启内核级基带保护(阻止一切对非用户分区的写入，有效防止格机)'
        required: true
        type: boolean
        default: 'true'
      ccache_update:
        description: '更新ccache缓存(将本次编译生成的ccache缓存覆盖至仓库缓存，在更改编译配置、源码或需要刷新缓存时开启)'
        required: true
        type: boolean
        default: 'false'
      ccache_debug:
        description: '是否上传 Ccache调试日志(用于调试, 无需要不必开启)'
        required: true
        type: boolean
        default: 'false'
      kernel_suffix:
        description: '内核后缀(留空默认,开头别加连字符,勿加空格等影响指令运行的保留字符)'
        required: false
        type: string
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      ksuver: ${{ steps.ksu_version.outputs.ksuver }}
      sukisu_commit: ${{ steps.ksu_version.outputs.sukisu_commit }}
      ak3name: ${{ steps.create_zip.outputs.ak3name }}
    permissions:
      actions: write
      contents: read
    steps:
      - name: 安装环境依赖+初始化源码仓库及llvm-Clang18工具链
        run: |
          rm -rf kernel_workspace
          mkdir kernel_workspace
          cd kernel_workspace
          echo "当前仓库：$GITHUB_REPOSITORY"
          echo "当前分支：$GITHUB_REF_NAME"
          
          sudo apt-mark hold firefox &&
          sudo apt-mark hold libc-bin &&
          sudo apt purge man-db &&
          sudo rm -rf /var/lib/man-db/auto-update &&
          sudo apt update &&
          sudo apt-get install -y --no-install-recommends binutils python-is-python3 libssl-dev libelf-dev &
          
          wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/lib/ccache-x86-64 -O ccache &&
          sudo cp -f ./ccache /usr/bin/ccache &&
          sudo chmod +x /usr/bin/ccache &&
          rm -f ./ccache &
          
          echo "正在克隆源码仓库..."
          aria2c -s16 -x16 -k1M https://github.com/cctv18/android_kernel_common_oneplus_sm8750/archive/refs/heads/oneplus/sm8750_b_16.0.0_oneplus_13_6.6.118.zip -o common.zip && 
          unzip -q common.zip && 
          mv "android_kernel_common_oneplus_sm8750-oneplus-sm8750_b_16.0.0_oneplus_13_6.6.118" common &&
          rm -rf common.zip &
          
          echo "正在克隆llvm-clang18工具链..." &&
          mkdir -p clang18 &&
          aria2c -s16 -x16 -k1M https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/LLVM-Clang18-r510928/clang-r510928.zip -o clang.zip &&
          unzip -q clang.zip -d clang18 &&
          rm -rf clang.zip &
          
          echo "正在克隆构建工具..." &&
          aria2c -s16 -x16 -k1M https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/LLVM-Clang18-r510928/build-tools.zip -o build-tools.zip &&
          unzip -q build-tools.zip &&
          rm -rf build-tools.zip &
          
          wait
          echo "所有源码及llvm-Clang18工具链初始化完成！"
          echo "正在去除 ABI 保护 & 去除 dirty 后缀..."
          rm common/android/abi_gki_protected_exports_* || true
          for f in common/scripts/setlocalversion; do
            sed -i 's/ -dirty//g' "$f"
            sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' "$f"
          done

      - name: 配置ccache目录
        run: |
          echo "CCACHE_DIR=$HOME/.ccache_${{ env.KERNEL_VERSION }}.${{ env.SUB_VERSION }}" >> $GITHUB_ENV
          echo "CCACHE_MAXSIZE=3G" >> $GITHUB_ENV
          echo "当前磁盘空间："
          df -h
          echo "当前构建内核版本：${{ env.KERNEL_VERSION }}.${{ env.SUB_VERSION }}"
          if [[ "${{ github.event.inputs.droidspaces_enable }}" != "false" ]]; then
            CCACHE_REAL_KEY=${{ env.CCACHE_KEY }}-Droidspaces
          else
            CCACHE_REAL_KEY=${{ env.CCACHE_KEY }}-none
          fi
          echo "CCACHE_REAL_KEY=$CCACHE_REAL_KEY" >> $GITHUB_ENV

      - name: 载入当前版本内核的 ccache缓存
        uses: actions/cache@v5
        id: ccache-restore
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ env.CCACHE_REAL_KEY }}-${{ runner.os }}-${{ github.ref_name }}
          restore-keys: |
            ${{ env.CCACHE_REAL_KEY }}-${{ runner.os }}-
            ${{ env.CCACHE_REAL_KEY }}-

      - name: 拉取公共预置 ccache 缓存
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "检查本地缓存状态..."
          if [ -d "${{ env.CCACHE_DIR }}" ] && [ "$(ls -A ${{ env.CCACHE_DIR }} 2>/dev/null)" ]; then
            echo "检测到本地已成功载入 ccache 缓存，跳过公共 ccache 拉取！"
            exit 0
          fi
          
          echo "未命中缓存，尝试拉取最新公共 ccache ..."
          mkdir -p ${{ env.CCACHE_DIR }}
          if [[ "${{ github.event.inputs.droidspaces_enable }}" != "false" ]]; then
            FILE_NAME="ccache-${{ env.KERNEL_VERSION }}.${{ env.SUB_VERSION }}-Droidspaces.tar.zst"
          else
            FILE_NAME="ccache-${{ env.KERNEL_VERSION }}.${{ env.SUB_VERSION }}.tar.zst"
          fi
          
          if gh release download -p "$FILE_NAME" -R cctv18/public_ccache; then
            echo "成功下载 $FILE_NAME，正在解压..."
            tar -I zstd -xf "$FILE_NAME" -C ${{ env.CCACHE_DIR }}
            echo "公共 ccache 恢复完成！"
          else
            echo "公共 ccache 中未找到对应的 ccache 文件，将进行全量全新编译..."
          fi

      - name: 清除旧 ccache 缓存
        if: inputs.ccache_update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "正在清除仓库中的旧 ccache 缓存..."
          if gh cache delete ${{ env.CCACHE_REAL_KEY }}-${{ runner.os }}-${{ github.ref_name }} -R ${{ github.repository }}; then
            echo "成功删除旧的 ccache 缓存！"
          else
            echo "旧缓存不存在或已被清理！"
          fi
      
      - name: 初始化并配置ccache
        run: |
          export CCACHE_COMPILERCHECK="none"
          export CCACHE_BASEDIR="${{ github.workspace }}"
          export CCACHE_NOHASHDIR="true"
          export CCACHE_NOHARDLINK="true"
          export CCACHE_DIR="${{ env.CCACHE_DIR }}"
          export CCACHE_MAXSIZE="${{ env.CCACHE_MAXSIZE }}"
          
          mkdir -p "$CCACHE_DIR"
          echo "配置ccache缓存大小为: $CCACHE_MAXSIZE"
          ccache -M "$CCACHE_MAXSIZE"
          ccache -o compression=true
          
          echo "ccache初始状态:"
          ccache -s
          
          if [ "${{ steps.ccache-restore.outputs.cache-hit }}" == 'true' ]; then
            echo "ccache缓存命中详情:"
            ccache -sv
          fi

      - name: 添加KernelSU及KPM补丁
        id: ksu_version
        run: |
          cd kernel_workspace
          if [[ "${{ github.event.inputs.ksu_type }}" == "sukisu" ]]; then
            echo "正在配置 SukiSU Ultra 官方最新提交..."
            if [[ "${{ github.event.inputs.susfs_enable }}" == "true" ]]; then
              # 官方 builtin 分支携带 SUSFS Kconfig；ARM64 通过官方 branch-link hook 避免手工逐个插桩。
              SUKISU_BRANCH="builtin"
            else
              SUKISU_BRANCH="main"
            fi
            echo "SukiSU 集成分支：$SUKISU_BRANCH"
            curl -fLSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s -- "$SUKISU_BRANCH"

            # 不允许 setup 脚本静默回退到其他分支；确认实际 checkout 和必要 Kconfig 均存在。
            if [[ ! -d ./KernelSU/.git ]]; then
              echo "::error::SukiSU setup 后未找到 ./KernelSU Git 仓库"
              exit 1
            fi
            ACTUAL_SUKISU_BRANCH=$(git -C ./KernelSU branch --show-current)
            echo "实际 SukiSU 分支：${ACTUAL_SUKISU_BRANCH:-detached HEAD}"
            if [[ "$ACTUAL_SUKISU_BRANCH" != "$SUKISU_BRANCH" ]]; then
              echo "::error::SukiSU 分支不匹配：期望 $SUKISU_BRANCH，实际 ${ACTUAL_SUKISU_BRANCH:-detached HEAD}"
              exit 1
            fi
            if [[ "$SUKISU_BRANCH" == "builtin" ]]; then
              if ! grep -RqsE '^[[:space:]]*config[[:space:]]+KSU_SUSFS([[:space:]]|$)' ./KernelSU/kernel; then
                echo "::error::官方 builtin 源码中未找到 CONFIG_KSU_SUSFS 的 Kconfig 定义"
                exit 1
              fi
            fi
            echo 'CONFIG_KSU_FULL_NAME_FORMAT="%TAG_NAME%-%COMMIT_SHA%@cctv18"' >> ./common/arch/arm64/configs/gki_defconfig

            cd ./KernelSU
            SUKISU_COMMIT=$(git rev-parse HEAD)
            SUKISU_COMMIT_SHORT=$(git rev-parse --short=12 HEAD)
            KSU_VERSION=$(grep -m1 '^KSU_VERSION' kernel/Kbuild | grep -oE '[0-9]+(-[a-zA-Z0-9]+)?' | head -n1 || true)
            if [[ -z "$KSU_VERSION" ]]; then
              KSU_VERSION=$(git rev-list --count HEAD 2>/dev/null || echo "unknown")
            fi
            echo "SUKISU_COMMIT=$SUKISU_COMMIT" >> "$GITHUB_ENV"
            echo "SUKISU_BRANCH=$SUKISU_BRANCH" >> "$GITHUB_ENV"
            echo "KSUVER=$KSU_VERSION" >> "$GITHUB_ENV"
            echo "ksuver=$KSU_VERSION" >> "$GITHUB_OUTPUT"
            echo "sukisu_commit=$SUKISU_COMMIT" >> "$GITHUB_OUTPUT"
            echo "SukiSU commit: $SUKISU_COMMIT ($SUKISU_COMMIT_SHORT)"
            cd ..
          elif [[ ${{ github.event.inputs.ksu_type }} == "resukisu" ]]; then
            echo "正在配置ReSukiSU/BakaSU（锁定 v4.2.0-rc3，main 分支含 SUSFS 门禁 error 指令）..."
            curl -LSs "https://raw.githubusercontent.com/Baka-SU/BakaSU/refs/heads/main/kernel/setup.sh" | bash -s v4.2.0-rc3
            echo 'CONFIG_KSU_FULL_NAME_FORMAT="%TAG_NAME%-%COMMIT_SHA%@cctv18"' >> ./common/arch/arm64/configs/gki_defconfig
            cd ./KernelSU
            sed -i 's|^KSU_VERSION :=.*|KSU_VERSION := 35171|' kernel/Kbuild
            KSU_VERSION=35171
            echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
            echo "ksuver=$KSU_VERSION" >> $GITHUB_OUTPUT
          elif [[ ${{ github.event.inputs.ksu_type }} == "ksunext" ]]; then
            echo "正在配置KernelSU Next..."
            curl -LSs "https://raw.githubusercontent.com/pershoot/KernelSU-Next/refs/heads/dev-susfs/kernel/setup.sh" | bash -s dev-susfs
            cd KernelSU-Next
            rm -rf .git
            KSU_VERSION=$(expr $(curl -sI "https://api.github.com/repos/pershoot/KernelSU-Next/commits?sha=dev&per_page=1" | grep -i "link:" | sed -n 's/.*page=\([0-9]*\)>; rel="last".*/\1/p') "+" 30000)
            echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
            echo "ksuver=$KSU_VERSION" >> $GITHUB_OUTPUT
            sed -i "s/KSU_VERSION_FALLBACK := 1/KSU_VERSION_FALLBACK := $KSU_VERSION/g" kernel/Kbuild
            KSU_GIT_TAG=$(curl -sL "https://api.github.com/repos/KernelSU-Next/KernelSU-Next/tags" | grep -o '"name": *"[^"]*"' | head -n 1 | sed 's/"name": "//;s/"//')
            sed -i "s/KSU_VERSION_TAG_FALLBACK := v0.0.1/KSU_VERSION_TAG_FALLBACK := $KSU_GIT_TAG/g" kernel/Kbuild
            cd ../common/drivers/kernelsu
            wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/other_patch/apk_sign.patch
            patch -p2 -N -F 3 < apk_sign.patch || true
          elif [[ ${{ github.event.inputs.ksu_type }} == "ksu" ]]; then
            echo "正在配置原版 KernelSU (tiann/KernelSU)..."
            curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/refs/heads/main/kernel/setup.sh" | bash -s main
            cd ./KernelSU
            KSU_VERSION=$(expr $(curl -sI "https://api.github.com/repos/tiann/KernelSU/commits?sha=main&per_page=1" | grep -i "link:" | sed -n 's/.*page=\([0-9]*\)>; rel="last".*/\1/p') "+" 30000)
            echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
            echo "ksuver=$KSU_VERSION" >> $GITHUB_OUTPUT
            sed -i "s/DKSU_VERSION=16/DKSU_VERSION=${KSU_VERSION}/" kernel/Kbuild
          else
            echo "已选择无内置KernelSU模式，跳过KernelSU配置..."
          fi

      - name: 应用 KernelSU & SUSFS 补丁
        if: ${{ inputs.susfs_enable && github.event.inputs.ksu_type != 'none' }}
        run: |
          cd kernel_workspace
          echo "正在添加susfs补丁..."
          git clone --depth=1 https://github.com/cctv18/susfs4oki.git susfs4ksu -b oki-${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}
          wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/other_patch/69_hide_stuff.patch -O ./common/69_hide_stuff.patch
          cp ./susfs4ksu/kernel_patches/50_add_susfs_in_gki-${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}.patch ./common/
          cp ./susfs4ksu/kernel_patches/fs/* ./common/fs/
          cp ./susfs4ksu/kernel_patches/include/linux/* ./common/include/linux/
          cd ./common
          patch -p1 < 50_add_susfs_in_gki-${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}.patch || true
          patch -p1 -N -F 3 < 69_hide_stuff.patch || true
          cd ..
          if [[ "${{ github.event.inputs.ksu_type }}" == "ksu" ]]; then
            cp ./susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch ./KernelSU/
            cd ./KernelSU
            patch -p1 < 10_enable_susfs_for_ksu.patch || true
          elif [[ "${{ github.event.inputs.ksu_type }}" == "resukisu" ]]; then
            echo "ReSukiSU 已原生集成 SUSFS，跳过 KernelSU bridge 补丁。"
          elif [[ "${{ github.event.inputs.ksu_type }}" == "sukisu" ]]; then
            echo "SukiSU builtin 自带 SUSFS Kconfig；已应用内核侧 SUSFS 补丁，跳过 KernelSU bridge 补丁。"
          fi
          
      - name: 为 SukiSU builtin 接入 ARM64 手动 Hooks
        if: ${{ github.event.inputs.ksu_type == 'sukisu' && inputs.susfs_enable }}
        working-directory: kernel_workspace
        shell: bash
        run: |
          set -euo pipefail
          echo "为 SukiSU builtin 接入 Linux 6.6 手动 Hooks（Android 15）..."
          python3 - <<'PYHOOK'
          from pathlib import Path
          import re, sys

          def insert_once(path, pattern, replacement, marker, label):
              p = Path(path)
              text = p.read_text()
              # Idempotency is based on the actual function-call marker, not whitespace-sensitive
              # matching of the whole inserted block. This prevents duplicate hooks when an
              # earlier SUSFS patch already added the same call.
              count = text.count(marker)
              if count == 1:
                  print(f"✓ {label} 已存在且唯一，跳过")
                  return
              if count > 1:
                  raise SystemExit(f"::error::{label}: {path} 中调用已出现 {count} 次，拒绝自动删除或继续插入")
              matches = list(re.finditer(pattern, text, flags=re.S))
              if len(matches) != 1:
                  raise SystemExit(f"::error::{label}: 在 {path} 中匹配到 {len(matches)} 个目标位置，拒绝盲目修改")
              m = matches[0]
              text = text[:m.end()] + replacement + text[m.end():]
              p.write_text(text)
              print(f"✓ 已插入 {label}")

          # Linux 6.6 Android common: do_execveat_common has int retval; before first executable logic.
          insert_once(
              "common/fs/exec.c",
              r"(static int do_execveat_common\s*\([^)]*\)\s*\{(?:(?!\n\}).)*?\n\s*int retval;)",
              "\n#ifdef CONFIG_KSU\n\textern int ksu_handle_execveat(int *, struct filename **, void *, void *, int *);\n\tksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);\n#endif",
              "ksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);", "execveat hook")

          # SUSFS-enabled SukiSU changes these handler APIs to take struct filename **.
          # The syscall entry points below expose const char __user * instead, so the
          # generic user-pointer hooks are ABI-incompatible in this configuration.
          # Do not inject a conflicting declaration or an invalid call; keep these hooks
          # disabled unless the source has the user-pointer API expected by the generic guide.
          open_source = Path("common/fs/open.c").read_text()
          if re.search(r"ksu_handle_faccessat\s*\(\s*int\s*\*\s*dfd\s*,\s*struct filename\s*\*\*", open_source):
              print("⚠ SUSFS 的 faccessat handler 使用 struct filename **；跳过不兼容的 syscall-level user-pointer hook")
          else:
              insert_once(
                  "common/fs/open.c",
                  r"(SYSCALL_DEFINE3\(faccessat,\s*int,\s*dfd,\s*const char __user \*,\s*filename,\s*int,\s*mode\)\s*\{)",
                  "\n#ifdef CONFIG_KSU\n\textern int ksu_handle_faccessat(int *, const char __user **, int *, int *);\n\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n#endif",
                  "ksu_handle_faccessat(&dfd, &filename, &mode, NULL);", "faccessat hook")

          # Hook sys_newfstatat only when the handler uses the user-pointer API.
          stat_source = Path("common/fs/stat.c").read_text()
          if re.search(r"ksu_handle_stat\s*\(\s*int\s*\*\s*dfd\s*,\s*struct filename\s*\*\*", stat_source):
              print("⚠ SUSFS 的 stat handler 使用 struct filename **；跳过不兼容的 syscall-level user-pointer hook")
          else:
              insert_once(
                  "common/fs/stat.c",
                  r"(SYSCALL_DEFINE4\(newfstatat,\s*int,\s*dfd,\s*const char __user \*,\s*filename,\s*struct stat __user \*,\s*statbuf,\s*int,\s*flag\)\s*\{\s*struct kstat stat;\s*int error;)",
                  "\n#ifdef CONFIG_KSU\n\textern int ksu_handle_stat(int *, const char __user **, int *);\n\tksu_handle_stat(&dfd, &filename, &flag);\n#endif",
                  "ksu_handle_stat(&dfd, &filename, &flag);", "newfstatat hook")

          # New KernelSU supercall reboot hook.
          insert_once(
              "common/kernel/reboot.c",
              r"(SYSCALL_DEFINE4\(reboot,\s*int,\s*magic1,\s*int,\s*magic2,\s*unsigned int,\s*cmd,\s*void __user \*,\s*arg\)\s*\{(?:(?!\n\}).)*?\n\s*int ret = 0;)",
              "\n#if defined(CONFIG_KSU) && !defined(CONFIG_KSU_KPROBES_KSUD)\n\textern int ksu_handle_sys_reboot(int, int, unsigned int, void __user **);\n\tksu_handle_sys_reboot(magic1, magic2, cmd, &arg);\n#endif",
              "ksu_handle_sys_reboot(magic1, magic2, cmd, &arg);", "reboot hook")

          # Fail closed: all four known Android 15 / 6.6 entry points must be present exactly once.
          checks = {
              "common/fs/exec.c": ["ksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);"],
              "common/kernel/reboot.c": ["ksu_handle_sys_reboot(magic1, magic2, cmd, &arg);"]
          }
          # Validate user-pointer hooks only when the corresponding SUSFS filename** API is absent.
          if not re.search(r"ksu_handle_faccessat\s*\(\s*int\s*\*\s*dfd\s*,\s*struct filename\s*\*\*", Path("common/fs/open.c").read_text()):
              checks["common/fs/open.c"] = ["ksu_handle_faccessat(&dfd, &filename, &mode, NULL);"]
          if not re.search(r"ksu_handle_stat\s*\(\s*int\s*\*\s*dfd\s*,\s*struct filename\s*\*\*", Path("common/fs/stat.c").read_text()):
              checks["common/fs/stat.c"] = ["ksu_handle_stat(&dfd, &filename, &flag);"]
          for path, needles in checks.items():
              content = Path(path).read_text()
              for needle in needles:
                  count = content.count(needle)
                  if count != 1:
                      print(f"::error::Hook 验证失败：{path} 中 {needle!r} 出现 {count} 次")
                      for i, line in enumerate(content.splitlines(), 1):
                          if needle in line:
                              print(f"  {path}:{i}: {line.strip()}")
                      raise SystemExit(1)
          print("已验证 execveat / faccessat / newfstatat / reboot 四个 Hook。")
          print("提示：Android 15 不强制要求 Android 16 新增的 newfstat 返回 Hook。")
          PYHOOK

